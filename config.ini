[data.handling]
# Chunk size used when processing large AnnData objects. Must be an integer.
CHUNKSIZES = 5000


###############################################################################
# obs.keys
#
# This section defines which columns in `adata.obs` are REQUIRED by the linter.
#
# IMPORTANT CONCEPT:
# - The LEFT-HAND SIDE (e.g. CELL_TYPE) is a canonical, human-readable concept.
# - The RIGHT-HAND SIDE (e.g. cell_type) is the ACTUAL column name expected
#   to exist in `adata.obs`.
# - Set to `None` to disable enforcement
#
###############################################################################
[obs.keys]
# Unique cell identifiers. Often stored in `adata.obs.index`, so enforcement is disabled by default.
CELL_IDS = None
# Cell type annotation column (e.g. T, B, NK, etc.)
CELL_TYPE = cell_type
# Biological or technical sample identifier.
SAMPLE = sample
# Batch identifier used for batch correction or QC.
BATCH = batch
# Number of detected genes per cell.
N_GENES = n_genes
# Total counts / UMIs per cell.
N_COUNTS = n_counts
# Percent mitochondrial reads per cell.
PERCENT_MITO = percent_mito
# Clustering label (e.g. Leiden clustering).
LEIDEN = leiden
# Experimental condition (e.g. treated vs control).
CONDITION = condition


###############################################################################
# var.keys
#
# This section defines which columns in `adata.var` are REQUIRED by the linter.
#
# The same concept/value rules apply as in [obs.keys]:
# - Canonical concept name on the left
# - Actual column name on the right
# - Set to `None` to disable enforcement
###############################################################################
[var.keys]
# Unique gene identifiers (e.g. Ensembl IDs).
GENE_IDS = gene_ids
# Gene symbols (e.g. TP53, EGFR).
GENE_SYMBOLS = gene_symbols
# Flag indicating highly variable genes.
HIGHLY_VARIABLE = highly_variable
# Mean expression per gene.
MEANS = means
# Expression dispersion per gene.
DISPERSIONS = dispersions
# Whether a gene is mitochondrial.
MITO = mito
# Chromosome annotation for each gene.
CHROMOSOME = chromosome
