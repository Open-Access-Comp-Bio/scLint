name: Lint and Spellcheck

on:
  pull_request:

jobs:
  lint:
    name: Code formatting and spell check
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install formatting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black codespell black[jupyter]

    - name: Run Black (check + show diff)
      run: |
        echo "Checking formatting with Black..."
        black --check --diff --color .

    - name: Run codespell
      run: |
        echo "Running spell check with codespell..."
        codespell --ignore-words-list="nd,te,hass"
