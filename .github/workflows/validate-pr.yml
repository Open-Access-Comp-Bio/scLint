name: Validate PR

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Check branch naming and targets
      run: |
        echo "Head branch: ${{ github.head_ref }}"
        echo "Base branch: ${{ github.base_ref }}"
        
        # Require PR branch to be prefixed with feature/ or bug/
        if [[ ! "${{ github.head_ref }}" =~ ^(feature|bug)/ ]]; then
          echo "❌ Branch name must start with 'feature/' or 'bug/'."
          exit 1
        fi

        # Require feature/ or bug/ branches to only merge into staging
        if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" =~ ^(feature|bug)/ ]]; then
          echo "❌ Feature or bug branches must target 'staging', not 'main'."
          exit 1
        fi

        echo "✅ PR branch name and target are valid."
